# sweep.example.toml — PTBot Sweep Runner configuration
#
# Usage:
#   ptbot-sweep --config my-sweep.toml
#   ptbot-sweep --config my-sweep.toml --dry-run          # preview without running
#   ptbot-sweep --config my-sweep.toml --db-path ~/custom.db  # override DB path
#
# Copy this file, edit the markets list, and run.  Combinations already in the
# database are detected automatically and skipped on subsequent runs, so you
# can interrupt and resume freely.

[sweep]
# How many years back from today to sweep (produces N complete calendar years
# plus the current year as a partial window ending today).
years_back = 10

# SQLite database to write results into.  Tilde expansion is supported.
db_path = "~/.ptbot/ptbot.db"

# Base directory for per-run output files (markdown, PDF, Excel).
# Each run writes to {output_base_dir}/{sector-slug}/{geography-slug}/{year}/.
output_base_dir = "./precedent-txn-output"

# Minimum number of standard valuation multiples required for a deal to
# qualify (passed directly to the pipeline filter).
min_multiples = 1

# Per-agent timeout in seconds.
timeout = 900

# --- Market targets ---
# Add one [[markets]] block per (sector, geography) combination you want to sweep.
# The sweep runs all combinations sequentially, oldest year first.

[[markets]]
sector = "Vertical SaaS"
geography = "United States"

[[markets]]
sector = "HealthTech"
geography = "United States"

[[markets]]
sector = "FinTech"
geography = "United States"

[[markets]]
sector = "EdTech"
geography = "United States"
