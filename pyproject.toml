[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptbot"
version = "0.1.0"
description = "Two-pass precedent transaction research bot for Oz/Warp agents"
requires-python = ">=3.11"
dependencies = [
  "fpdf2>=2.8",
  "openpyxl>=3.1",
  "pydantic>=2.8",
]

[project.scripts]
ptbot = "ptbot.cli:main"
ptbot-sweep = "ptbot.sweep_cli:main"

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "isort>=5.13",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "ruff>=0.5",
]
app = [
  "streamlit>=1.35",
  "pandas>=2.0",
  "plotly>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "PIE", "PT", "RET", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=ptbot --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/ptbot"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
