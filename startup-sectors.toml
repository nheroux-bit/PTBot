# PTBot — Startup Tech Full Coverage Sweep
#
# This config sweeps all 38 major tech startup verticals over 10 years.
# Run with: ptbot-sweep --config startup-sectors.toml --cloud --environment <env-id>
#
# The sweep is incremental — existing market×year combinations are skipped
# automatically. Re-run weekly to keep the database current as new deals close.
#
# For a no-config-file alternative, use:
#   ptbot sweep:auto --preset startup-tech --geography "United States" --environment <env-id>

[sweep]
years_back = 10
db_path = "~/.ptbot/ptbot.db"
output_base_dir = "./precedent-txn-output"
min_multiples = 1
timeout = 900
max_workers = 8              # 8 parallel pipelines for fast coverage
max_active_cloud_runs = 20   # raised for large sweeps; lower if hitting Oz limits

